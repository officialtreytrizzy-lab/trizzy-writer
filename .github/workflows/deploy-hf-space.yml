name: Deploy Hugging Face CPU Space

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "space/**"
      - "scripts/deploy_hf_space.py"
      - ".github/workflows/deploy-hf-space.yml"

permissions:
  contents: read

concurrency:
  group: trizzy-writer-hf-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ secrets.HF_TOKEN != '' && secrets.HF_SPACE_REPO != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face client
        run: python -m pip install "huggingface-hub>=0.33,<1"

      - name: Create or update Space
        run: python scripts/deploy_hf_space.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
          HF_SPACE_PRIVATE: ${{ secrets.HF_SPACE_PRIVATE }}
