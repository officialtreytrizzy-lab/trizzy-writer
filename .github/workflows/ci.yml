name: Trizzy Writer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: trizzy-writer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          TRIZZY_MODEL_PROVIDER: openai-compatible
          TRIZZY_MODEL_API_URL: https://example.invalid
          TRIZZY_MODEL_NAME: trizzy-writer-ci
